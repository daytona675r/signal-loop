# NON-PRODUCTION BLUEPRINT — DO NOT DEPLOY AS-IS.
# This reference configuration has no authentication, rate limits or safe
# anonymous-data policy. Public hosting requires a separate hardening review.
services:
  - type: web
    name: signalloop-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signalloop-db
          property: connectionString

databases:
  - name: signalloop-db
    plan: free
