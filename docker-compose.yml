services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signalloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-signalloop}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      target: base
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-signalloop}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-signalloop}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
  test:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-signalloop}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-signalloop}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
