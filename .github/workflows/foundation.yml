name: Foundation CI

on:
  push:
    branches: [foundation-v0.1]
  pull_request:
    branches: [foundation-v0.1]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Foundation quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Disposable runner-local database; these are not production credentials.
      DATABASE_URL: postgresql+psycopg://signalloop:local-development-only@localhost:5433/signalloop
      TEST_DATABASE_URL: postgresql+psycopg://signalloop:local-development-only@localhost:5433/signalloop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Build application Docker image
        id: build
        run: docker compose build api
      - name: Ruff lint and formatting
        id: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Start PostgreSQL
        id: database
        run: docker compose up -d --wait --wait-timeout 60 db
      - name: Apply migrations and check drift
        id: migrations
        run: |
          alembic upgrade head
          alembic check
      - name: PostgreSQL integration tests
        id: tests
        run: pytest -q
      - name: Publish quality summary
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          RUFF_RESULT: ${{ steps.ruff.outcome }}
          DATABASE_RESULT: ${{ steps.database.outcome }}
          MIGRATION_RESULT: ${{ steps.migrations.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: |
          {
            echo '## Foundation v0.1 quality gate'
            echo
            echo "Commit: $GITHUB_SHA"
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| Docker build | $BUILD_RESULT |"
            echo "| Ruff lint / format | $RUFF_RESULT |"
            echo "| PostgreSQL startup | $DATABASE_RESULT |"
            echo "| Migrations / drift | $MIGRATION_RESULT |"
            echo "| PostgreSQL tests | $TEST_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Database diagnostics on failure
        if: failure()
        run: docker compose logs --no-color db
      - name: Clean up disposable CI services
        if: always()
        run: docker compose down --volumes --remove-orphans
